! sw-f3 - floor 3 access switch, rooms 301-312
!
service timestamps debug datetime msec localtime
service timestamps log datetime msec localtime
service password-encryption
!
hostname sw-f3
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
enable algorithm-type scrypt secret __ENABLE_PASS__
username netadmin privilege 15 algorithm-type scrypt secret __ADMIN_PASS__
!
clock timezone ICT 7 0
no ip domain lookup
ip domain name baan-chalong.lan
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
no ip http server
no ip http secure-server
!
vtp mode transparent
errdisable recovery cause bpduguard
errdisable recovery cause psecure-violation
errdisable recovery interval 300
!
ntp server 10.20.10.1
!
logging buffered 32768 informational
logging host 10.20.10.250
logging trap informational
logging source-interface Vlan10
!
ip access-list standard ACL-MGMT
 permit 10.20.10.0 0.0.0.255
 deny   any log
!
snmp-server view V-RO iso included
snmp-server group G-NMS v3 priv read V-RO access ACL-MGMT
snmp-server user nms G-NMS v3 auth sha __SNMP_AUTH__ priv aes 128 __SNMP_PRIV__
snmp-server location Baan Chalong Residence, floor 3
snmp-server contact netadmin@baan-chalong.lan
snmp-server enable traps snmp linkdown linkup
snmp-server enable traps port-security
snmp-server host 10.20.10.250 version 3 priv nms
!
banner motd ^C
Authorized access only. Activity is logged.
Baan Chalong Residence network - disconnect if you are not staff.
^C
!
spanning-tree mode rapid-pvst
spanning-tree extend system-id
!
vlan 10
 name MGMT
vlan 30
 name CCTV
vlan 40
 name GUEST
vlan 103
 name TENANT-F3
vlan 999
 name BLACKHOLE
!
ip dhcp snooping
ip dhcp snooping vlan 40,103
no ip dhcp snooping information option
!
interface GigabitEthernet1/0/1
 description room-301
 switchport mode access
 switchport access vlan 103
 switchport protected
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 storm-control broadcast level 5.00
 storm-control multicast level 10.00
 storm-control action trap
 spanning-tree portfast
 spanning-tree bpduguard enable
 ip dhcp snooping limit rate 15
 no cdp enable
 no shutdown
