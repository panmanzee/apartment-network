#config-version=FGT60F-7.4.4-FW-build2662-240319:opmode=0:vdom=0
# Baan Chalong Residence - edge firewall (FortiGate 60F), generated from plan/ip-plan.yaml
config system global
    set hostname "fw-edge"
    set alias "fw-edge"
    set timezone "Asia/Bangkok"
    set admintimeout 10
    set admin-ssh-port 22
    set admin-sport 8443
    set admin-https-redirect disable
    set admin-https-ssl-versions tlsv1-2 tlsv1-3
    set admin-lockout-threshold 5
    set admin-lockout-duration 300
    set strong-crypto enable
end
config system password-policy
    set status enable
    set minimum-length 12
end
config system admin
    edit "netadmin"
        set accprofile "super_admin"
        set trusthost1 10.20.10.0 255.255.255.0
        set password __ADMIN_PASS__
    next
end
config system ntp
    set ntpsync enable
    set type custom
    set server-mode enable
    set interface "v10-mgmt"
    config ntpserver
        edit 1
            set server "th.pool.ntp.org"
        next
        edit 2
            set server "time.google.com"
        next
    end
end
config system dns
    set primary 1.1.1.1
    set secondary 9.9.9.9
end
config log syslogd setting
    set status enable
    set server "10.20.10.50"
    set source-ip 10.20.10.1
end
config system snmp sysinfo
    set status enable
    set description "Baan Chalong Residence edge firewall"
    set location "Baan Chalong Residence, MDF rack"
    set contact-info "netadmin@baan-chalong.lan"
end
config system snmp user
    edit "nms"
        set security-level auth-priv
        set auth-proto sha256
        set auth-pwd __SNMP_AUTH__
        set priv-proto aes
        set priv-pwd __SNMP_PRIV__
        set queries enable
        set query-port 161
        set trap-status disable
    next
end
config system interface
    edit "wan1"
        set vdom "root"
        set mode dhcp
        set defaultgw enable
        set allowaccess ping
        set alias "ISP-A primary"
        set role wan
    next
    edit "wan2"
        set vdom "root"
        set mode dhcp
        set defaultgw enable
        set allowaccess ping
        set alias "ISP-B backup"
        set role wan
    next
    edit "lag-core"
        set vdom "root"
        set type aggregate
        set member "internal1" "internal2"
        set lacp-mode active
        set lacp-speed slow
        set alias "to sw-core Po1"
        set role lan
    next
    edit "v10-mgmt"
        set vdom "root"
        set vlanid 10
        set interface "lag-core"
        set ip 10.20.10.1 255.255.255.0
        set alias "MGMT"
        set role lan
        set allowaccess ping https ssh snmp
    next
    edit "v20-staff"
        set vdom "root"
        set vlanid 20
        set interface "lag-core"
        set ip 10.20.20.1 255.255.255.0
        set alias "STAFF"
        set role lan
        set allowaccess ping
    next
    edit "v30-cctv"
        set vdom "root"
        set vlanid 30
        set interface "lag-core"
        set ip 10.20.30.1 255.255.255.0
        set alias "CCTV"
        set role lan
        set allowaccess ping
    next
    edit "v40-guest"
        set vdom "root"
        set vlanid 40
        set interface "lag-core"
        set ip 10.20.40.1 255.255.255.0
        set alias "GUEST"
        set role lan
        set allowaccess ping
        set security-mode captive-portal
        set security-groups "grp-guest-portal"
    next
    edit "v101-tenant-f1"
        set vdom "root"
        set vlanid 101
        set interface "lag-core"
        set ip 10.21.1.1 255.255.255.0
        set alias "TENANT-F1"
        set role lan
        set allowaccess ping
    next
    edit "v102-tenant-f2"
        set vdom "root"
        set vlanid 102
        set interface "lag-core"
        set ip 10.21.2.1 255.255.255.0
        set alias "TENANT-F2"
        set role lan
        set allowaccess ping
    next
    edit "v103-tenant-f3"
        set vdom "root"
        set vlanid 103
        set interface "lag-core"
        set ip 10.21.3.1 255.255.255.0
        set alias "TENANT-F3"
        set role lan
        set allowaccess ping
    next
    edit "v104-tenant-f4"
        set vdom "root"
        set vlanid 104
        set interface "lag-core"
        set ip 10.21.4.1 255.255.255.0
        set alias "TENANT-F4"
        set role lan
        set allowaccess ping
    next
    edit "v105-tenant-f5"
        set vdom "root"
        set vlanid 105
        set interface "lag-core"
        set ip 10.21.5.1 255.255.255.0
        set alias "TENANT-F5"
        set role lan
        set allowaccess ping
    next
end
config system sdwan
    set status enable
    config zone
        edit "virtual-wan-link"
        next
    end
    config members
        edit 1
            set interface "wan1"
            set zone "virtual-wan-link"
            set cost 10
        next
        edit 2
            set interface "wan2"
            set zone "virtual-wan-link"
            set cost 20
        next
    end
    config health-check
        edit "hc-internet"
            set server "1.1.1.1" "9.9.9.9"
            set protocol ping
            set interval 1000
            set failtime 3
            set recoverytime 5
            set members 1 2
        next
    end
    config service
        edit 1
            set name "wan-failover"
            set mode priority
            set dst "all"
            set src "all"
            set health-check "hc-internet"
            set priority-members 1 2
        next
    end
end
config router static
    edit 1
        set sdwan-zone "virtual-wan-link"
        set comment "default via sd-wan, wan1 preferred"
    next
end
config user local
    edit "owner"
        set type password
        set passwd __OWNER_PASS__
    next
end
config user group
    edit "grp-owner-vpn"
        set member "owner"
    next
    edit "grp-guest-portal"
        set group-type guest
    next
end
config vpn ipsec phase1-interface
    edit "owner-vpn-a"
        set type dynamic
        set interface "wan1"
        set ike-version 2
        set authmethod psk
        set eap enable
        set eap-identity send-request
        set authusrgrp "grp-owner-vpn"
        set peertype any
        set mode-cfg enable
        set ipv4-start-ip 10.20.50.10
        set ipv4-end-ip 10.20.50.250
        set ipv4-netmask 255.255.255.0
        set ipv4-split-include "grp-vpn-allowed"
        set dpd on-idle
        set dpd-retrycount 3
        set dpd-retryinterval 10
        set proposal aes256-sha256
        set dhgrp 20 14
        set psksecret __IPSEC_PSK__
        set comments "FortiClient dial-up, owner"
    next
    edit "owner-vpn-b"
        set type dynamic
        set interface "wan2"
        set ike-version 2
        set authmethod psk
        set eap enable
        set eap-identity send-request
        set authusrgrp "grp-owner-vpn"
        set peertype any
        set mode-cfg enable
        set ipv4-start-ip 10.20.50.10
        set ipv4-end-ip 10.20.50.250
        set ipv4-netmask 255.255.255.0
        set ipv4-split-include "grp-vpn-allowed"
        set dpd on-idle
        set dpd-retrycount 3
        set dpd-retryinterval 10
        set proposal aes256-sha256
        set dhgrp 20 14
        set psksecret __IPSEC_PSK__
        set comments "FortiClient dial-up, owner"
    next
end
config vpn ipsec phase2-interface
    edit "owner-vpn-a"
        set phase1name "owner-vpn-a"
        set proposal aes256-sha256
        set pfs enable
        set dhgrp 20
    next
    edit "owner-vpn-b"
        set phase1name "owner-vpn-b"
        set proposal aes256-sha256
        set pfs enable
        set dhgrp 20
    next
end
config firewall address
    edit "net-MGMT"
        set subnet 10.20.10.0 255.255.255.0
    next
    edit "net-STAFF"
        set subnet 10.20.20.0 255.255.255.0
    next
    edit "net-CCTV"
        set subnet 10.20.30.0 255.255.255.0
    next
    edit "net-GUEST"
        set subnet 10.20.40.0 255.255.255.0
    next
    edit "net-TENANT-F1"
        set subnet 10.21.1.0 255.255.255.0
    next
    edit "net-TENANT-F2"
        set subnet 10.21.2.0 255.255.255.0
    next
    edit "net-TENANT-F3"
        set subnet 10.21.3.0 255.255.255.0
    next
    edit "net-TENANT-F4"
        set subnet 10.21.4.0 255.255.255.0
    next
    edit "net-TENANT-F5"
        set subnet 10.21.5.0 255.255.255.0
    next
    edit "net-OWNER-VPN"
        set subnet 10.20.50.0 255.255.255.0
    next
    edit "rfc1918-10"
        set subnet 10.0.0.0 255.0.0.0
    next
    edit "rfc1918-172"
        set subnet 172.16.0.0 255.240.0.0
    next
    edit "rfc1918-192"
        set subnet 192.168.0.0 255.255.0.0
    next
end
config firewall addrgrp
    edit "grp-tenants"
        set member "net-TENANT-F1" "net-TENANT-F2" "net-TENANT-F3" "net-TENANT-F4" "net-TENANT-F5"
    next
    edit "grp-rfc1918"
        set member "rfc1918-10" "rfc1918-172" "rfc1918-192"
    next
    edit "grp-vpn-allowed"
        set member "net-MGMT" "net-CCTV"
    next
end
config firewall service custom
    edit "svc-tcp-443-554"
        set tcp-portrange 443 554
    next
end
config firewall service group
    edit "grp-mgmt-out"
        set member "HTTPS" "HTTP" "DNS" "NTP"
    next
end
config firewall shaper per-ip-shaper
    edit "shp-tenant"
        set max-bandwidth 100000
        set bandwidth-unit kbps
    next
    edit "shp-guest"
        set max-bandwidth 20000
        set bandwidth-unit kbps
    next
end
config firewall shaping-policy
    edit 1
        set name "shape-tenant"
        set comment "plan policy 1: 100/50 Mbps per device (per-IP)"
        set service "ALL"
        set srcaddr "grp-tenants"
        set dstaddr "all"
        set dstintf "virtual-wan-link"
        set per-ip-shaper "shp-tenant"
    next
    edit 2
        set name "shape-guest"
        set comment "plan policy 4: 20/10 Mbps per client"
        set service "ALL"
        set srcaddr "net-GUEST"
        set dstaddr "all"
        set dstintf "virtual-wan-link"
        set per-ip-shaper "shp-guest"
    next
end
config firewall policy
    edit 1
        set name "p02-TENANT-all-to-TENANT-all"
        set comments "plan policy 2: TENANT-* -> TENANT-* deny"
        set srcintf "v101-tenant-f1" "v102-tenant-f2" "v103-tenant-f3" "v104-tenant-f4" "v105-tenant-f5"
        set dstintf "v101-tenant-f1" "v102-tenant-f2" "v103-tenant-f3" "v104-tenant-f4" "v105-tenant-f5"
        set srcaddr "grp-tenants"
        set dstaddr "grp-tenants"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 2
        set name "p03-TENANT-all-to-internal"
        set comments "plan policy 3: TENANT-* -> MGMT+STAFF+CCTV+GUEST deny"
        set srcintf "v101-tenant-f1" "v102-tenant-f2" "v103-tenant-f3" "v104-tenant-f4" "v105-tenant-f5"
        set dstintf "v10-mgmt" "v20-staff" "v30-cctv" "v40-guest"
        set srcaddr "grp-tenants"
        set dstaddr "net-MGMT" "net-STAFF" "net-CCTV" "net-GUEST"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 3
        set name "p05-GUEST-to-rfc1918"
        set comments "plan policy 5: GUEST -> rfc1918 deny"
        set srcintf "v40-guest"
        set dstintf "any"
        set srcaddr "net-GUEST"
        set dstaddr "grp-rfc1918"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 4
        set name "p08-CCTV-to-internet"
        set comments "plan policy 8: CCTV -> internet deny"
        set srcintf "v30-cctv"
        set dstintf "virtual-wan-link"
        set srcaddr "net-CCTV"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 5
        set name "p01-TENANT-all-to-internet"
        set comments "plan policy 1: TENANT-* -> internet allow"
        set srcintf "v101-tenant-f1" "v102-tenant-f2" "v103-tenant-f3" "v104-tenant-f4" "v105-tenant-f5"
        set dstintf "virtual-wan-link"
        set srcaddr "grp-tenants"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat enable
        set logtraffic utm
    next
    edit 6
        set name "p04-GUEST-to-internet"
        set comments "plan policy 4: GUEST -> internet allow"
        set srcintf "v40-guest"
        set dstintf "virtual-wan-link"
        set srcaddr "net-GUEST"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat enable
        set logtraffic utm
    next
    edit 7
        set name "p06-STAFF-to-internet"
        set comments "plan policy 6: STAFF -> internet allow"
        set srcintf "v20-staff"
        set dstintf "virtual-wan-link"
        set srcaddr "net-STAFF"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat enable
        set logtraffic utm
    next
    edit 8
        set name "p07-STAFF-to-CCTV"
        set comments "plan policy 7: STAFF -> CCTV allow"
        set srcintf "v20-staff"
        set dstintf "v30-cctv"
        set srcaddr "net-STAFF"
        set dstaddr "net-CCTV"
        set action accept
        set schedule "always"
        set service "svc-tcp-443-554"
        set nat disable
        set logtraffic utm
    next
    edit 9
        set name "p09-OWNER-VPN-to-MGMT+CCTV"
        set comments "plan policy 9: OWNER-VPN -> MGMT+CCTV allow"
        set srcintf "owner-vpn-a" "owner-vpn-b"
        set dstintf "v10-mgmt" "v30-cctv"
        set srcaddr "net-OWNER-VPN"
        set dstaddr "net-MGMT" "net-CCTV"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat disable
        set logtraffic utm
    next
    edit 10
        set name "p10-MGMT-to-internet"
        set comments "plan policy 10: MGMT -> internet allow"
        set srcintf "v10-mgmt"
        set dstintf "virtual-wan-link"
        set srcaddr "net-MGMT"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "grp-mgmt-out"
        set nat enable
        set logtraffic utm
    next
    edit 11
        set name "deny-all-log"
        set comments "catch-all"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end
